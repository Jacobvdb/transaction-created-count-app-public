<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Transaction Created Count</title>
        <style>
            :root {
                color: #1f2933;
                background: #f5f7fb;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
            }

            body {
                margin: 0;
                min-height: 100vh;
            }

            main {
                box-sizing: border-box;
                min-height: 100vh;
                padding: 16px;
                display: flex;
                align-items: stretch;
                justify-content: center;
            }

            .card {
                box-sizing: border-box;
                width: min(100%, 460px);
                padding: 28px;
                border-radius: 18px;
                background: #ffffff;
                box-shadow: 0 20px 50px rgba(31, 41, 51, 0.12);
            }

            .report-card {
                width: min(100%, 760px);
                min-height: calc(100vh - 32px);
                display: flex;
                flex-direction: column;
            }

            .centered {
                text-align: center;
            }

            .error {
                border: 1px solid #fecaca;
                color: #991b1b;
            }

            h1 {
                margin: 0;
                color: #111827;
                font-size: 56px;
                line-height: 1;
                letter-spacing: -0.05em;
            }

            .centered h1,
            .error h1 {
                margin-bottom: 12px;
                font-size: 28px;
                letter-spacing: -0.03em;
            }

            p {
                margin: 0;
                line-height: 1.5;
            }

            .eyebrow {
                margin-bottom: 12px;
                color: #52677a;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .subtitle {
                margin-top: 12px;
                color: #52677a;
                font-size: 16px;
            }

            .details {
                margin: 24px 0 0;
                display: grid;
                gap: 14px;
            }

            .details div {
                padding-top: 14px;
                border-top: 1px solid #e5e7eb;
            }

            .summary-grid {
                grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            }

            dt {
                color: #6b7280;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            dd {
                margin: 4px 0 0;
                color: #111827;
                font-size: 14px;
            }

            button.primary {
                margin-top: 20px;
                padding: 10px 18px;
                border: 0;
                border-radius: 8px;
                background: #2563eb;
                color: #ffffff;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            button.primary:hover {
                background: #1d4ed8;
            }

            button.secondary {
                padding: 7px 12px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                background: #ffffff;
                color: #1f2933;
                font: inherit;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
            }

            button.secondary:hover {
                background: #f8fafc;
            }

            .link-button {
                padding: 0;
                border: 0;
                background: transparent;
                color: #2563eb;
                font: inherit;
                font-weight: 700;
                text-align: left;
                cursor: pointer;
            }

            .link-button:hover {
                color: #1d4ed8;
                text-decoration: underline;
            }

            .row-action {
                display: block;
                margin-top: 3px;
                color: #6b7280;
                font-size: 11px;
            }

            .breakdown {
                margin-top: 24px;
                min-height: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .breakdown-header {
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            h2 {
                margin: 0;
                color: #111827;
                font-size: 18px;
                letter-spacing: -0.02em;
            }

            .table-wrap {
                min-height: 220px;
                flex: 1;
                overflow: auto;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }

            th,
            td {
                padding: 10px 12px;
                border-bottom: 1px solid #e5e7eb;
                text-align: left;
                vertical-align: top;
            }

            th {
                position: sticky;
                top: 0;
                background: #f8fafc;
                color: #52677a;
                font-size: 11px;
                font-weight: 800;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            tr:last-child td {
                border-bottom: 0;
            }

            .number {
                text-align: right;
                white-space: nowrap;
            }

            .row-error td {
                color: #991b1b;
                background: #fff7f7;
            }

            .detail-row td {
                background: #f8fafc;
            }

            .detail-grid {
                margin: 0;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 12px;
            }

            .detail-section-header {
                margin-top: 14px;
                margin-bottom: 8px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #6b7280;
            }

            .detail-section-main {
                margin-top: 20px;
                color: #374151;
            }

            .detail-metric {
                padding: 10px;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                background: #ffffff;
            }

            .detail-metric dd {
                font-size: 18px;
                font-weight: 800;
            }

            .detail-metric p {
                margin-top: 4px;
                color: #6b7280;
                font-size: 11px;
            }

            details {
                margin-top: 20px;
                color: #52677a;
                font-size: 13px;
            }

            details p {
                margin-top: 10px;
            }

            summary {
                cursor: pointer;
                font-weight: 700;
            }

            code {
                display: block;
                margin-top: 10px;
                padding: 10px;
                overflow-wrap: anywhere;
                border-radius: 8px;
                background: #f3f4f6;
                color: #111827;
            }

            .spinner {
                width: 32px;
                height: 32px;
                margin: 0 auto 16px;
                border: 3px solid #dbeafe;
                border-top-color: #2563eb;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <main>
            <section class="card centered">
                <div class="spinner" aria-hidden="true"></div>
                <p>Loading...</p>
            </section>
        </main>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
